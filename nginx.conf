map $uri $cache_control { default "no-cache"; /config.json "no-store"; }
server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 include /etc/nginx/mime.types;
 add_header Cache-Control $cache_control always;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' http://localhost:8080 http://localhost:8180 https:; worker-src 'self' blob:; frame-src 'self' http://localhost:8180; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
 location = /healthz { access_log off; return 200 "ok"; }
 location = /config.json { try_files $uri =404; }
 location = /index.html { expires -1; }
 location / { try_files $uri $uri/ /index.html; }
}
